<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>每日全球热点金融逻辑 · 归档索引</title>
<style>
  :root{
    --green:#1f4d3f;--green-soft:#e8f1ed;--teal:#0e7490;--teal-soft:#e0f2f7;
    --amber:#d97706;--amber-soft:#fef3c7;--red:#b91c1c;--red-soft:#fee2e2;
    --line:#e5e7eb;--muted:#6b7280;--card:#fafaf9;--bg:#f5f5f4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#1f2937;line-height:1.6;padding:20px;max-width:900px;margin:0 auto;}
  header{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px;}
  h1{color:var(--green);font-size:24px;margin-bottom:8px;}
  .sub{color:var(--muted);font-size:13px;}
  .stats{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;}
  .stat{background:var(--green-soft);padding:8px 14px;border-radius:8px;font-size:13px;}
  .stat b{color:var(--green);font-size:16px;}
  a.back{color:var(--teal);text-decoration:none;font-size:13px;}
  a.back:hover{text-decoration:underline;}

  .month-group{margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .month-header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;cursor:pointer;user-select:none;background:var(--green-soft);}
  .month-header:hover{background:#dde9e3;}
  .month-title{font-size:16px;font-weight:700;color:var(--green);margin-left:8px;}
  .month-count{font-size:12px;color:var(--muted);background:#fff;padding:2px 10px;border-radius:10px;}
  .chevron{transition:transform 0.2s;color:var(--green);font-size:12px;display:inline-block;}
  .month-group.open .chevron{transform:rotate(90deg);}
  .month-body{display:none;padding:8px 0;}
  .month-group.open .month-body{display:block;}

  .day-row{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--line);gap:12px;flex-wrap:wrap;}
  .day-row:first-child{border-top:none;}
  .day-row:hover{background:#fafaf9;}
  .date-badge{font-weight:700;color:var(--green);font-size:15px;min-width:90px;}
  .day-title{flex:1;font-size:13px;}
  .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;}
  .tag{font-size:11px;background:var(--teal-soft);color:var(--teal);padding:1px 8px;border-radius:10px;}
  .open-btn{font-size:12px;color:#fff;background:var(--green);padding:5px 12px;border-radius:6px;text-decoration:none;white-space:nowrap;}
  .open-btn:hover{background:#163a2f;}
  .latest-badge{display:inline-block;font-size:10px;background:var(--amber);color:#fff;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:middle;}
  .latest-row{background:#fffbeb;}

  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;padding-top:20px;border-top:1px dashed var(--line);}
</style>
</head>
<body>
<header>
  <a class="back" href="./艾丽财经分析方法论_普通人知识图谱.html">← 返回主知识库（方法论+知识图谱）</a>
  <h1>📚 每日全球热点金融逻辑 · 归档</h1>
  <p class="sub">按月份折叠，点月份标题展开/收起。和手机日历一样，按月归档，点日期进卡片。</p>
  <div class="stats">
    <div class="stat">📅 已更新 <b id="count">—</b> 天</div>
    <div class="stat">🔄 最近更新 <b id="latest">—</b></div>
    <div class="stat">🗂 月份数 <b id="months">—</b></div>
  </div>
</header>

<div id="list"></div>

<footer>
  本归档仅为思维框架演示，不构成任何投资建议。<br>
  配色：深墨绿+琥珀+砖红 · 不出现买卖建议 · 数据来自实时拉取
</footer>

<script>
const cards = [
  {date:"2026-10-18", title:"周末两颗雷：伊朗真关霍尔木兹+油轮触雷爆炸，AI抛售蔓延到债市，VIX单日+21%破20", tags:["霍尔木兹关闭","VIX破20","半导体八连跌","AI债市"]},
  {date:"2026-10-17", title:"沃什一个字不提利率，10月加息概率崩到15%以下——但布油单日暴涨4%到110，纳指反而-2.14%", tags:["沃什静默","加息<15%","布油110","纳指-2.14%"]},
  {date:"2026-10-16", title:"PPI环比1.3%爆得比CPI还猛，但道指涨556点——资金从AI切到医疗消费", tags:["PPI+1.3%","创业板-2.92%","道指+556","资金切消费"]},
  {date:"2026-10-15", title:"CPI爆雷：核心2.6%超预期！10月加息概率从21.6%飙到51.5%，昨天深V被埋", tags:["CPI 3.7%","核心2.6%","纳指-1.88%","半导体六连跌"]},
  {date:"2026-10-14", title:"CPI审判日：威廉姆斯凌晨放鸽，A股深V从-3.5%拉回-0.18%", tags:["CPI前夜","威廉姆斯鸽派","A股深V","A50夜盘"]},
  {date:"2026-10-13", title:"A股利好出尽暴跌2.61%，哈玛克放鹰，PCE前夜", tags:["A股-2.61%","哈玛克放鹰","PCE前夜"]},
  {date:"2026-10-12", title:"英伟达对达里奥喊话免疫，布油拉锯，中欧缓和", tags:["英伟达","达里奥AI泡沫","布油105"]},
  {date:"2026-10-11", title:"达里奥喊AI泡沫，飓风减弱，南美元币结算", tags:["达里奥","AI泡沫","本币结算"]},
  {date:"2026-10-10", title:"飓风停产72% vs 普京放柴油30万吨（新模板首卡）", tags:["飓风","柴油出口","F1-G3首卡"]},
  {date:"2026-10-09", title:"AI capex 7300亿 vs 市场用脚投票", tags:["AI capex","7300亿","市场质疑"]},
  {date:"2026-10-08", title:"FOMC首提AI通胀 + 10Y拍卖出清", tags:["FOMC","AI通胀","10Y拍卖"]},
  {date:"2026-10-07", title:"加息预期崩了但长端不买账", tags:["加息预期","长端利率","鲍曼鹰派"]}
];

const groups = {};
cards.forEach((c,i)=>{
  const [y,m] = c.date.split('-');
  const key = `${y}年${parseInt(m)}月`;
  if(!groups[key]) groups[key] = [];
  groups[key].push({...c, isLatest: i===0});
});

const list = document.getElementById('list');
const monthKeys = Object.keys(groups);
monthKeys.forEach((key, idx)=>{
  const items = groups[key];
  const div = document.createElement('div');
  div.className = 'month-group' + (idx===0?' open':'');
  div.innerHTML = `
    <div class="month-header">
      <div><span class="chevron">▶</span><span class="month-title">${key}</span></div>
      <span class="month-count">${items.length} 天</span>
    </div>
    <div class="month-body"></div>
  `;
  const body = div.querySelector('.month-body');
  items.forEach(c=>{
    const row = document.createElement('div');
    row.className = 'day-row' + (c.isLatest?' latest-row':'');
    row.innerHTML = `
      <div class="date-badge">${c.date.slice(5)}${c.isLatest?'<span class="latest-badge">最新</span>':''}</div>
      <div class="day-title">
        ${c.title}
        <div class="tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <a class="open-btn" href="./daily/${c.date}.html">打开 →</a>
    `;
    body.appendChild(row);
  });
  div.querySelector('.month-header').addEventListener('click', ()=>{
    div.classList.toggle('open');
  });
  list.appendChild(div);
});

document.getElementById('count').textContent = cards.length;
document.getElementById('latest').textContent = cards[0].date;
document.getElementById('months').textContent = monthKeys.length;
</script>
</body>
</html>
